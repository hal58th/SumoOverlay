[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-overlay"
version = "0.1.0"
description = "A local, manually controlled sumo bout overlay for OBS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SocketIO>=5.3,<6",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["app", "bout_state", "sumo_data"]
packages = ["templates", "static"]

[tool.setuptools.package-data]
templates = ["*.html"]
static = ["*.css"]
