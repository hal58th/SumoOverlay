<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Emperor's Cup">
  <defs>
    <linearGradient id="ec-silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8795"/>
      <stop offset=".16" stop-color="#edf1f7"/>
      <stop offset=".38" stop-color="#b9c2ce"/>
      <stop offset=".6" stop-color="#f9fcff"/>
      <stop offset=".8" stop-color="#9ba6b4"/>
      <stop offset="1" stop-color="#5f6a79"/>
    </linearGradient>
    <linearGradient id="ec-silver-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a4adba"/>
      <stop offset=".45" stop-color="#e8edf4"/>
      <stop offset="1" stop-color="#7a8594"/>
    </linearGradient>
    <linearGradient id="ec-black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset=".38" stop-color="#242a33"/>
      <stop offset=".62" stop-color="#171b21"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
  </defs>

  <!-- long loop handles, drawn behind the bowl -->
  <g fill="none" stroke-linecap="round">
    <path d="M20 14.6C12.3 12.4 7.8 16.7 8.2 23.8c.5 8.5 5.9 14.1 13.7 14.4"
          stroke="#303743" stroke-width="4.6"/>
    <path d="M44 14.6c7.7-2.2 12.2 2.1 11.8 9.2-.5 8.5-5.9 14.1-13.7 14.4"
          stroke="#303743" stroke-width="4.6"/>
    <path d="M20 14.6C12.3 12.4 7.8 16.7 8.2 23.8c.5 8.5 5.9 14.1 13.7 14.4"
          stroke="url(#ec-silver)" stroke-width="2.1"/>
    <path d="M44 14.6c7.7-2.2 12.2 2.1 11.8 9.2-.5 8.5-5.9 14.1-13.7 14.4"
          stroke="url(#ec-silver)" stroke-width="2.1"/>
  </g>

  <!-- finial and domed lid -->
  <ellipse cx="32" cy="4.5" rx="2.4" ry="2.1"
           fill="url(#ec-silver)" stroke="#303743" stroke-width="1.2"/>
  <rect x="31.1" y="6.1" width="1.8" height="2.2" rx=".7"
        fill="url(#ec-silver-soft)" stroke="#303743" stroke-width="1"/>
  <path d="M22.5 12.7c.3-3.8 4.3-6.4 9.5-6.4s9.2 2.6 9.5 6.4Z"
        fill="url(#ec-silver)" stroke="#303743" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M25.2 11.5c1.1-2 3.4-3.2 6.2-3.4" fill="none"
        stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".65"/>
  <rect x="19" y="12.1" width="26" height="3.5" rx="1.75"
        fill="url(#ec-silver)" stroke="#303743" stroke-width="1.3"/>

  <!-- tall urn-shaped bowl -->
  <path d="M19.5 15.4h25c0 5.9-1 10.9-2.5 14.4-1.6 4.6-5.6 7.5-10.5 7.5s-8.9-2.9-10.5-7.5c-1.5-3.5-2.5-8.5-2.5-14.4Z"
        fill="url(#ec-silver)" stroke="#303743" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M23.2 18c-.3 6.2.2 11 1.8 14.2" fill="none"
        stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
  <path d="M40.8 18c.4 6.2.1 11-1.4 14.2" fill="none"
        stroke="#39414d" stroke-width="1.1" stroke-linecap="round" opacity=".3"/>
  <path d="M25.2 21.5c-.2 3.4.3 6.1 1.3 8.1M38.8 21.5c.2 3.4-.3 6.1-1.3 8.1"
        fill="none" stroke="#fff" stroke-width=".7" stroke-linecap="round" opacity=".32"/>

  <!-- fluted lower band -->
  <path d="M24.1 34.1c1.7 2 4.5 3.1 7.9 3.1s6.2-1.1 7.9-3.1l-.9 3.9c-1.5 1.6-3.9 2.5-7 2.5s-5.5-.9-7-2.5Z"
        fill="url(#ec-silver-soft)" stroke="#303743" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M27 35.1v3.6M31 36v3.2M35 35.1v3.6" fill="none"
        stroke="#4b5563" stroke-width=".8" opacity=".65"/>

  <!-- slim flared pedestal -->
  <path d="M29.4 38h5.2l1.2 5.1h-7.6Z"
        fill="url(#ec-silver-soft)" stroke="#303743" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="27.1" y="42.9" width="9.8" height="1.9" rx=".95"
        fill="url(#ec-silver)" stroke="#303743" stroke-width="1.1"/>
  <path d="M27.7 44.6h8.6c3.5 0 6.3 1.3 7.6 3.4H20.1c1.3-2.1 4.1-3.4 7.6-3.4Z"
        fill="url(#ec-silver)" stroke="#303743" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- black base with silver bands and plaques -->
  <ellipse cx="32" cy="48.3" rx="17.2" ry="2.3"
           fill="#20262e" stroke="#9aa5b3" stroke-width="1.2"/>
  <path d="M14.8 48.3h34.4v8.4c0 2-7.7 3.5-17.2 3.5s-17.2-1.5-17.2-3.5Z"
        fill="url(#ec-black)" stroke="#8b96a4" stroke-width="1.2"/>
  <rect x="14.8" y="49.5" width="34.4" height="1.2" fill="url(#ec-silver-soft)"/>
  <rect x="14.8" y="53.2" width="34.4" height="1.1" fill="url(#ec-silver-soft)"/>

  <g fill="url(#ec-silver-soft)">
    <rect x="17.1" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="21.7" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="26.3" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="30.9" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="35.5" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="40.1" y="50.9" width="3.2" height="1.9" rx=".35"/>
    <rect x="44.7" y="50.9" width="3.2" height="1.9" rx=".35"/>
  </g>
  <g fill="url(#ec-silver-soft)">
    <rect x="18" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="22.4" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="26.8" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="31.2" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="35.6" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="40" y="54.5" width="2.9" height="1.8" rx=".3"/>
    <rect x="44.4" y="54.5" width="2.9" height="1.8" rx=".3"/>
  </g>

  <rect x="13.4" y="57.2" width="37.2" height="4.6" rx="1.5"
        fill="#11151a" stroke="#9aa5b3" stroke-width="1.2"/>
  <ellipse cx="32" cy="61.9" rx="18.6" ry="1.3" fill="#06080b" opacity=".55"/>
</svg>
