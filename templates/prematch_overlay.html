<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ "Sumo Pre-Match Overlay v2" if prematch_v2|default(false) else "Sumo Pre-Match Overlay" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='overlay.css', v=18) }}">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='name-fitting.js', v=5) }}"></script>
</head>
<body>
  <main id="pre-match-overlay" class="configured-box pre-match-card{% if prematch_v2|default(false) %} prematch-v2{% endif %}" hidden aria-live="polite">
    <div class="bout-meta">
      <span id="division"></span>
      <span id="division-number"></span>
      <span id="bout-number"></span>
    </div>
    <div class="matchup">
      <section class="wrestler east">
        <div id="east-name" class="wrestler-name"></div>
        <div class="rank-record">
          <div id="east-rank" class="rank"></div>
          <div id="east-record" class="record"></div>
        </div>
        <div id="east-honors" class="wrestler-honors" hidden></div>
        <div id="east-profile" class="wrestler-profile"></div>
      </section>
      <div class="versus{% if prematch_v2|default(false) %} prematch-v2-versus{% endif %}"{% if prematch_v2|default(false) %} aria-hidden="true"{% endif %}>VS</div>
      <section class="wrestler west">
        <div id="west-name" class="wrestler-name"></div>
        <div class="rank-record">
          <div id="west-rank" class="rank"></div>
          <div id="west-record" class="record"></div>
        </div>
        <div id="west-honors" class="wrestler-honors" hidden></div>
        <div id="west-profile" class="wrestler-profile"></div>
      </section>
    </div>
    <div class="head-to-head">
      <div id="head-to-head-score" class="head-to-head-score"></div>
      <div id="head-to-head-history" class="head-to-head-history" aria-label="Prior match results"></div>
    </div>
    <div id="overlay-error" class="overlay-error" role="alert"></div>
  </main>
  <script>
    const prematchV2 = {{ prematch_v2|default(false)|tojson }};
    const kinboshiIconUrl = "{{ url_for('static', filename='kinboshi.svg') }}";
    const emperorsCupIconUrl = "{{ url_for('static', filename='emperors_cup.svg') }}";
    const preMatchOverlay = document.getElementById("pre-match-overlay");
    const overlayError = document.getElementById("overlay-error");
    const fitWrestlerNames = window.createPairedNameFitter([
      document.getElementById("east-name"),
      document.getElementById("west-name")
    ]);
    let hideTimer = null;
    let lastBoutKey = null;
    let lastTimerKey = null;
    let lastRecordKey = null;
    let lastPinned = null;
    function updateOverlaySize(state) {
      if (state.settings && state.settings.overlay) {
        const style = state.settings.overlay[prematchV2 ? "prematchv2" : "prematch"];
        const { width, height, opacity } = style;
        const root = document.documentElement;
        root.style.setProperty("--overlay-font-family", style.font_family);
        root.style.setProperty("--overlay-text-color", style.colors.text);
        root.style.setProperty("--overlay-muted-color", style.colors.muted);
        root.style.setProperty("--overlay-accent-color", style.colors.accent);
        root.style.setProperty("--overlay-current-score-color", style.colors.current_score);
        root.style.setProperty("--overlay-result-color", style.colors.result);
        root.style.setProperty("--overlay-background-color", style.colors.background);
        root.style.setProperty("--overlay-text-font-size", `${style.font_sizes.text}px`);
        root.style.setProperty("--overlay-muted-font-size", `${style.font_sizes.muted}px`);
        root.style.setProperty("--overlay-accent-font-size", `${style.font_sizes.accent}px`);
        root.style.setProperty(
          "--overlay-current-score-font-size",
          `${style.font_sizes.current_score}px`
        );
        root.style.setProperty("--overlay-result-font-size", `${style.font_sizes.result}px`);
        root.style.setProperty(
          "--prematch-meta-font-size",
          `${style.font_sizes.accent * (36 / 54)}px`
        );
        root.style.setProperty(
          "--prematch-profile-font-size",
          `${style.font_sizes.muted * (prematchV2 ? 30 : 26) / 36 + (prematchV2 ? 4 : 0)}px`
        );
        root.style.setProperty(
          "--prematch-versus-font-size",
          `${style.font_sizes.muted * (28 / 36)}px`
        );
        root.style.setProperty(
          "--prematch-head-to-head-font-size",
          `${style.font_sizes.text * (46 / 88)}px`
        );
        root.style.setProperty(
          "--prematch-history-font-size",
          `${style.font_sizes.text * (28 / 88)}px`
        );
        root.style.setProperty(
          "--prematch-error-font-size",
          `${style.font_sizes.result * (13 / 60)}px`
        );
        preMatchOverlay.style.width = `${width}px`;
        preMatchOverlay.style.height = `${height}px`;
        preMatchOverlay.style.setProperty("--pre-match-opacity", String(opacity));
        preMatchOverlay.style.setProperty(
          "--prematch-text-opacity",
          String(style.text_opacity)
        );
        fitWrestlerNames(style.font_sizes.text);
        if (style.border) {
          const borderWidth = style.border.width !== undefined ? style.border.width : 1;
          const borderColor = style.border.color || "rgb(255 255 255 / 20%)";
          root.style.setProperty("--prematch-border-width", `${borderWidth}px`);
          root.style.setProperty("--prematch-border-style", borderWidth > 0 ? "solid" : "none");
          root.style.setProperty("--prematch-border-color", borderColor);
          preMatchOverlay.style.borderWidth = `${borderWidth}px`;
          preMatchOverlay.style.borderStyle = borderWidth > 0 ? "solid" : "none";
          preMatchOverlay.style.borderColor = borderColor;
        }
        syncWrestlerHonorsHeights();
      }
    }

    function recordText(record) {
      return record ? `${record.wins}-${record.losses}` : "Record unavailable";
    }

    function renderBoutRecord(side, record, threshold, announcedWinner) {
      const container = document.getElementById(`${side}-record`);
      if (!record) {
        const unavailable = document.createElement("span");
        unavailable.textContent = recordText(record);
        container.replaceChildren(unavailable);
        return;
      }

      const wins = document.createElement(
        typeof record.wins === "number" && record.wins >= threshold ? "strong" : "span"
      );
      wins.classList.toggle("announced-result", announcedWinner === side);
      wins.textContent = String(record.wins);
      const losses = document.createElement(
        typeof record.losses === "number" && record.losses >= threshold ? "strong" : "span"
      );
      losses.classList.toggle(
        "announced-result",
        announcedWinner !== null && announcedWinner !== undefined && announcedWinner !== side
      );
      losses.textContent = String(record.losses);
      container.replaceChildren(wins, document.createTextNode("-"), losses);
    }

    function monthsBetweenBashos(start, end) {
      if (
        typeof start !== "string" || !/^\d{6}$/.test(start) ||
        typeof end !== "string" || !/^\d{6}$/.test(end)
      ) return null;
      const startMonth = Number(start.slice(4, 6));
      const endMonth = Number(end.slice(4, 6));
      if (startMonth < 1 || startMonth > 12 || endMonth < 1 || endMonth > 12) return null;
      const months =
        (Number(end.slice(0, 4)) - Number(start.slice(0, 4))) * 12 +
        endMonth - startMonth;
      return months >= 0 ? months : null;
    }

    function ageFromBirthDate(birthDate) {
      if (typeof birthDate !== "string") return null;
      const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(birthDate);
      if (!match) return null;
      const [, yearText, monthText, dayText] = match;
      const year = Number(yearText);
      const month = Number(monthText);
      const day = Number(dayText);
      const birth = new Date(Date.UTC(year, month - 1, day));
      if (
        birth.getUTCFullYear() !== year ||
        birth.getUTCMonth() !== month - 1 ||
        birth.getUTCDate() !== day
      ) return null;
      const today = new Date();
      let months = (today.getFullYear() - year) * 12 + today.getMonth() - (month - 1);
      if (today.getDate() < day) months--;
      if (months < 0) return null;
      return { years: Math.floor(months / 12), months: months % 12 };
    }

    function compareAge(eastAge, westAge) {
      if (!eastAge || !westAge) return { east: false, west: false };
      const eastMonths = eastAge.years * 12 + eastAge.months;
      const westMonths = westAge.years * 12 + westAge.months;
      return {
        east: eastMonths >= westMonths,
        west: westMonths >= eastMonths,
      };
    }

    function rankComparisonKey(rank) {
      if (typeof rank !== "string") return null;
      const match =
        /^(Mae-zumo|Jonokuchi|Jonidan|Sandanme|Makushita|Juryo|Maegashira|Komusubi|Sekiwake|Ozeki|Yokozuna)(?: (\d+) (?:East|West))?$/.exec(
          rank.trim()
        );
      return match ? `${match[1]} ${match[2] || ""}` : null;
    }

    function renderCurrentRank(side, rank, highestRank) {
      const container = document.getElementById(`${side}-rank`);
      const text = rank || "Rank unavailable";
      const comparisonKey = rankComparisonKey(rank);
      if (comparisonKey && comparisonKey === rankComparisonKey(highestRank)) {
        const emphasizedRank = document.createElement("strong");
        emphasizedRank.textContent = text;
        container.replaceChildren(emphasizedRank);
      } else {
        container.textContent = text;
      }
    }

    function heightText(heightCm) {
      if (typeof heightCm !== "number" || heightCm <= 0) return null;
      const totalInches = Math.round(heightCm / 2.54);
      const feet = Math.floor(totalInches / 12);
      const inches = totalInches % 12;
      return prematchV2
        ? `${heightCm} cm / ${feet}'${inches}"`
        : `Height: ${heightCm} cm (${feet}'${inches}")`;
    }

    function weightText(weightKg) {
      if (typeof weightKg !== "number" || weightKg <= 0) return null;
      const pounds = Math.round(weightKg * 2.2046226218);
      const kilograms = prematchV2 ? Math.trunc(weightKg) : weightKg;
      return prematchV2
        ? `${kilograms} kg / ${pounds} lb`
        : `Weight: ${kilograms} kg (${pounds} lb)`;
    }

    function renderWrestlerProfile(side, profile, state, comparisons) {
      const content = profile || {};
      const container = document.getElementById(`${side}-profile`);
      const lines = [];
      const line = (label, value, emphasized = false) => {
        const line = document.createElement("div");
        line.className = "wrestler-profile-line";
        line.append(document.createTextNode(`${label}: `));
        const valueNode = emphasized
          ? document.createElement("strong")
          : document.createElement("span");
        valueNode.textContent = value;
        line.append(valueNode);
        lines.push(line);
      };
      const age = ageFromBirthDate(content.birthDate);
      const lifetime = content.lifetime;
      if (lifetime && typeof lifetime.matches === "number") {
        const lifetimeLine = document.createElement("div");
        lifetimeLine.className = "wrestler-profile-line";
        if (!prematchV2) {
          lifetimeLine.append(document.createTextNode("Career: "));
        }
        const score = document.createElement(
          comparisons.lifetimeScore[side] ? "strong" : "span"
        );
        score.textContent = `${lifetime.wins}-${lifetime.losses}`;
        lifetimeLine.append(score, document.createTextNode(" ("));
        const percentage = document.createElement(
          comparisons.lifetimeScore[side] ? "strong" : "span"
        );
        percentage.textContent = lifetime.matches > 0
          ? `${(lifetime.wins / lifetime.matches * 100).toFixed(1)}%`
          : "N/A";
        lifetimeLine.append(percentage, document.createTextNode(", "));
        const matchCount = document.createElement(
          comparisons.lifetimeMatches[side] ? "strong" : "span"
        );
        matchCount.textContent = String(lifetime.matches);
        lifetimeLine.append(matchCount, document.createTextNode(" matches)"));
        lines.push(lifetimeLine);
      }
      const wrestlingMonths = monthsBetweenBashos(content.debut, state.settings.bashoId);
      if (prematchV2) {
        const careerAgeLine = document.createElement("div");
        careerAgeLine.className = "wrestler-profile-line";
        const appendCareerAge = (label, value, emphasized) => {
          if (careerAgeLine.childNodes.length > 0) {
            careerAgeLine.append(document.createTextNode(" | "));
          }
          careerAgeLine.append(document.createTextNode(`${label}: `));
          const valueNode = emphasized
            ? document.createElement("strong")
            : document.createElement("span");
          valueNode.textContent = value;
          careerAgeLine.append(valueNode);
        };
        if (wrestlingMonths !== null) {
          appendCareerAge(
            "Career",
            `${Math.floor(wrestlingMonths / 12)} years`,
            comparisons.tenure[side]
          );
        }
        if (age) {
          appendCareerAge("Age", String(age.years), comparisons.age[side]);
        }
        if (careerAgeLine.childNodes.length > 0) lines.push(careerAgeLine);
      } else {
        if (wrestlingMonths !== null) {
          line(
            "Wrestling",
            `${Math.floor(wrestlingMonths / 12)} years, ${wrestlingMonths % 12} months`,
            comparisons.tenure[side]
          );
        }
        if (age) {
          line(
            "Age",
            `${age.years} years, ${age.months} months`,
            comparisons.age[side]
          );
        }
      }
      if (prematchV2 && (content.previousRank || content.firstBasho)) {
        line("Previous rank", content.previousRank || "First Basho");
      }
      if (content.highestRank) {
        const currentRank = state[side] && state[side].rank;
        const highestRankKey = rankComparisonKey(content.highestRank);
        line(
          "Highest rank",
          content.highestRank,
          highestRankKey !== null && highestRankKey === rankComparisonKey(currentRank)
        );
      }
      const height = heightText(content.height);
      const weight = weightText(content.weight);
      if (prematchV2) {
        const measurementsLine = document.createElement("div");
        measurementsLine.className = "wrestler-profile-line wrestler-profile-measurements";
        const appendMeasurement = (label, value, emphasized) => {
          if (measurementsLine.childNodes.length > 0) {
            measurementsLine.append(document.createTextNode(" | "));
          }
          measurementsLine.append(document.createTextNode(`${label} `));
          const valueNode = emphasized
            ? document.createElement("strong")
            : document.createElement("span");
          valueNode.textContent = value;
          measurementsLine.append(valueNode);
        };
        if (height) appendMeasurement("Ht.", height, comparisons.height[side]);
        if (weight) appendMeasurement("Wt.", weight, comparisons.weight[side]);
        if (measurementsLine.childNodes.length > 0) lines.push(measurementsLine);
      } else {
        if (height) line("Height", height.replace(/^Height: /, ""), comparisons.height[side]);
        if (weight) line("Weight", weight.replace(/^Weight: /, ""), comparisons.weight[side]);
      }
      if (typeof content.heya === "string" && content.heya) {
        line(prematchV2 ? "Stable" : "Stable (heya)", content.heya);
      }
      if (typeof content.shusshin === "string" && content.shusshin) {
        line(prematchV2 ? "Birthplace" : "Place of origin (shusshin)", content.shusshin);
      }
      container.replaceChildren(...lines);
    }

    function syncWrestlerHonorsHeights() {
      if (!prematchV2) return;
      const containers = [
        document.getElementById("east-honors"),
        document.getElementById("west-honors"),
      ];
      containers.forEach(container => {
        container.style.minHeight = "";
      });
      const tallest = Math.max(
        ...containers.map(container => container.getBoundingClientRect().height)
      );
      containers.forEach(container => {
        container.style.minHeight = `${Math.ceil(tallest)}px`;
      });
    }

    function renderWrestlerHonors(side, profile) {
      const container = document.getElementById(`${side}-honors`);
      if (!prematchV2) {
        container.replaceChildren();
        container.hidden = true;
        return;
      }
      const content = profile || {};
      const honors = [
        { key: "titles", label: "title", icon: emperorsCupIconUrl, value: content.titles },
        { key: "kinboshi", label: "kinboshi", icon: kinboshiIconUrl, value: content.kinboshi },
      ].filter(honor => Number.isInteger(honor.value) && honor.value > 0);
      const icons = honors.flatMap(honor =>
        Array.from({ length: honor.value }, () => {
          const icon = document.createElement("img");
          icon.className = "wrestler-honor-icon";
          icon.src = honor.icon;
          icon.alt = "";
          icon.setAttribute("aria-hidden", "true");
          return icon;
        })
      );
      container.replaceChildren(...icons);
      container.hidden = false;
      if (honors.length === 0) {
        container.removeAttribute("aria-label");
        container.removeAttribute("title");
        container.setAttribute("aria-hidden", "true");
        return;
      }
      const labels = honors.map(honor =>
        `${honor.value} ${honor.label}${honor.value === 1 ? "" : "s"}`
      );
      container.removeAttribute("aria-hidden");
      container.setAttribute("aria-label", `Career honors: ${labels.join(", ")}`);
      container.title = labels.join(", ");
    }

    function renderBout(state, suppressAutoShow = false) {
      if (!state.settings || !state.settings.overlay) return;
      updateOverlaySize(state);
      document.getElementById("division").textContent = state.division || state.settings.division;
      document.getElementById("division-number").textContent =
        `(Division ${state.divisionNumber})`;
      document.getElementById("bout-number").textContent =
        `Bout ${state.divisionBoutNumber} out of ${state.divisionTotal}`;
      document.getElementById("east-name").textContent = state.east.name;
      document.getElementById("west-name").textContent = state.west.name;
      fitWrestlerNames(
        state.settings.overlay[prematchV2 ? "prematchv2" : "prematch"].font_sizes.text
      );
      const emphasisThreshold = state.divisionNumber >= 3 ? 4 : 8;
      const profiles = state.wrestlerProfiles || {};
      const eastProfile = profiles.east || {};
      const westProfile = profiles.west || {};
      renderCurrentRank("east", state.east.rank, eastProfile.highestRank);
      renderCurrentRank("west", state.west.rank, westProfile.highestRank);
      renderBoutRecord("east", state.east.record, emphasisThreshold, state.announcedWinner);
      renderBoutRecord("west", state.west.record, emphasisThreshold, state.announcedWinner);
      const eastAge = ageFromBirthDate(eastProfile.birthDate);
      const westAge = ageFromBirthDate(westProfile.birthDate);
      const eastLifetime = eastProfile.lifetime;
      const westLifetime = westProfile.lifetime;
      const hasLifetime = profile =>
        profile && typeof profile.matches === "number" && profile.matches > 0;
      const eastScore = hasLifetime(eastLifetime)
        ? eastLifetime.wins / eastLifetime.matches
        : null;
      const westScore = hasLifetime(westLifetime)
        ? westLifetime.wins / westLifetime.matches
        : null;
      const compare = (eastValue, westValue) => ({
        east:
          typeof eastValue === "number" &&
          typeof westValue === "number" &&
          eastValue > westValue,
        west:
          typeof eastValue === "number" &&
          typeof westValue === "number" &&
          westValue > eastValue,
      });
      const comparisons = {
        age: compareAge(eastAge, westAge),
        lifetimeScore: compare(eastScore, westScore),
        lifetimeMatches: compare(
          eastLifetime && eastLifetime.matches,
          westLifetime && westLifetime.matches
        ),
        tenure: compare(
          monthsBetweenBashos(eastProfile.debut, state.settings.bashoId),
          monthsBetweenBashos(westProfile.debut, state.settings.bashoId)
        ),
        height: compare(eastProfile.height, westProfile.height),
        weight: compare(eastProfile.weight, westProfile.weight),
      };
      renderWrestlerProfile("east", eastProfile, state, comparisons);
      renderWrestlerProfile("west", westProfile, state, comparisons);
      renderWrestlerHonors("east", eastProfile);
      renderWrestlerHonors("west", westProfile);

      const h2h = state.headToHead;
      const h2hScore = document.getElementById("head-to-head-score");
      const h2hHistory = document.getElementById("head-to-head-history");
      h2hScore.textContent = !h2h
        ? "Head to Head: unavailable"
        : h2h.eastWins === 0 && h2h.westWins === 0
          ? "Head to Head: First Meeting"
          : `Head to Head: ${h2h.eastWins} - ${h2h.westWins}`;
      h2hHistory.replaceChildren();
      if (h2h && Array.isArray(h2h.history)) {
        h2h.history.forEach((winner, index) => {
          if (winner !== "east" && winner !== "west") return;
          const marker = document.createElement("span");
          marker.className = `head-to-head-result ${winner}`;
          marker.textContent = winner === "east" ? "←" : "→";
          marker.title = winner === "east" ? "Left wrestler won" : "Right wrestler won";
          marker.setAttribute("aria-label", `Bout ${index + 1}: ${marker.title}`);
          h2hHistory.appendChild(marker);
        });
      }
      overlayError.textContent = "";
      if (hideTimer !== null) window.clearTimeout(hideTimer);
      hideTimer = null;
      preMatchOverlay.hidden = false;
      syncWrestlerHonorsHeights();
      fitWrestlerNames(
        state.settings.overlay[prematchV2 ? "prematchv2" : "prematch"].font_sizes.text
      );
      if (state.settings.preMatchPinned) {
        preMatchOverlay.hidden = false;
        return;
      }
      if (suppressAutoShow) {
        preMatchOverlay.hidden = true;
        return;
      }
      const seconds = Math.max(
        0,
        state.divisionNumber <= 2
          ? state.settings.preMatchSalariedSeconds
          : state.settings.preMatchUnsalariedSeconds
      );
      if (seconds === 0) {
        preMatchOverlay.hidden = true;
        return;
      }
      preMatchOverlay.hidden = false;
      hideTimer = window.setTimeout(() => {
        preMatchOverlay.hidden = true;
        hideTimer = null;
      }, seconds * 1000);
    }

    function receiveBout(state) {
      updateOverlaySize(state);
      const boutKey = [
        state.settings && state.settings.bashoId,
        state.settings && state.settings.day,
        state.division,
        state.matchNo,
        state.east.rikishiId,
        state.west.rikishiId
      ].join(":");
      const timerKey = [
        state.settings && state.settings.preMatchSalariedSeconds,
        state.settings && state.settings.preMatchUnsalariedSeconds,
        state.settings && state.settings.preMatchPinned
      ].join(":");
      const recordKey = [
        state.east.record && state.east.record.wins,
        state.east.record && state.east.record.losses,
        state.west.record && state.west.record.wins,
        state.west.record && state.west.record.losses
      ].join(":");
      const recordChanged = recordKey !== lastRecordKey;
      lastRecordKey = recordKey;
      if (boutKey !== lastBoutKey || timerKey !== lastTimerKey) {
        const pinned = Boolean(state.settings && state.settings.preMatchPinned);
        const justUnpinned = lastPinned === true && !pinned;
        lastBoutKey = boutKey;
        lastTimerKey = timerKey;
        lastPinned = pinned;
        renderBout(state, justUnpinned);
      } else if (recordChanged) {
        const emphasisThreshold = state.divisionNumber >= 3 ? 4 : 8;
        renderBoutRecord("east", state.east.record, emphasisThreshold, state.announcedWinner);
        renderBoutRecord("west", state.west.record, emphasisThreshold, state.announcedWinner);
      }
    }

    function showError(message) {
      console.error(message);
      preMatchOverlay.hidden = true;
    }

    fetch("/api/pre-match-state")
      .then(async response => {
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Unable to load pre-match state");
        receiveBout(payload);
      })
      .catch(error => showError(error.message));

    if (typeof io === "function") {
      const socket = io();
      socket.on("bout_update", updateOverlaySize);
      socket.on("pre_match_update", receiveBout);
      socket.on("bout_result", state => {
        receiveBout(state);
      });
      socket.on("pre_match_error", payload => showError(payload.error));
      socket.on("connect_error", error => showError(`Overlay connection failed: ${error.message}`));
    } else {
      window.setInterval(() => {
        fetch("/api/pre-match-state")
          .then(async response => {
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || "Unable to load pre-match state");
            receiveBout(payload);
          })
          .catch(error => showError(error.message));
      }, 1000);
    }
